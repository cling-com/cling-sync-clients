name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the downloaded SDKs/toolchains under tools/ between runs instead
          # of letting `git clean` wipe them and force a multi-GB re-download.
          clean: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          # The self-hosted runner already persists the module cache on disk
          # between runs, so the GitHub-side cache layer is just overhead.
          cache: false
      - name: Build
        run: ./build.sh build
      - name: Lint
        run: ./build.sh lint
      # The runner is self-hosted, so anything a test step leaves running stays on
      # the machine: a booted simulator keeps its whole runtime resident, and a UI
      # test killed by its timeout leaves the app it drove behind. Either one costs
      # the timing-sensitive UI tests the CPU they need to finish in time.
      #
      # Every test step is bracketed by one of these. The step between two of them
      # is both the cleanup after the first and the cleanup before the second, and
      # the one below leads so that a run also starts clean: a job that is cancelled
      # or that loses its runner never reaches its own trailing cleanup, and its
      # leftovers would otherwise be inherited by the run after it.
      #
      # They run even when a test step failed, which is when there is most to clean
      # up, and none of them may fail the build.
      - name: Clean up before tests
        run: |
          xcrun simctl shutdown all || true
          pkill -x ClingSyncMac || true
          pkill -f ClingSyncMacUITests-Runner.app || true
      - name: Test (android unit)
        # Integration tests need an emulator with hardware virtualization.
        run: ./build.sh android test unit
      - name: Clean up after Android
        if: always()
        run: |
          xcrun simctl shutdown all || true
          pkill -x ClingSyncMac || true
          pkill -f ClingSyncMacUITests-Runner.app || true
      - name: Test (ios)
        run: ./build.sh ios test
      - name: Clean up after iOS
        if: always()
        run: |
          xcrun simctl shutdown all || true
          pkill -x ClingSyncMac || true
          pkill -f ClingSyncMacUITests-Runner.app || true
      - name: Test (macos)
        run: ./build.sh macos test
      - name: Clean up after macOS
        if: always()
        run: |
          xcrun simctl shutdown all || true
          pkill -x ClingSyncMac || true
          pkill -f ClingSyncMacUITests-Runner.app || true
      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload iOS test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-logs
          path: |
            ios/build/logs/
            ios/build/results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload macOS test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-logs
          path: |
            macos/build/testlogs/
            macos/build/logs/
            macos/build/results/
          if-no-files-found: ignore
          retention-days: 7
