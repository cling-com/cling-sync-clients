name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the downloaded SDKs/toolchains under tools/ between runs instead
          # of letting `git clean` wipe them and force a multi-GB re-download.
          clean: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          # The self-hosted runner already persists the module cache on disk
          # between runs, so the GitHub-side cache layer is just overhead.
          cache: false
      - name: Build
        run: ./build.sh build
      - name: Lint
        run: ./build.sh lint
      - name: Test (android unit)
        # Integration tests need an emulator with hardware virtualization.
        run: ./build.sh android test unit
      - name: Test (ios)
        run: ./build.sh ios test
      - name: Test (macos)
        run: ./build.sh macos test
      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload iOS test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-logs
          path: |
            ios/build/logs/
            ios/build/results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload macOS test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-logs
          path: |
            macos/build/testlogs/
            macos/build/logs/
            macos/build/results/
          if-no-files-found: ignore
          retention-days: 7
